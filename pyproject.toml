[project]
name = "polarizer"
version = "0.5.0"
description = "A local MCP proxy that pins tool definitions, holds risky calls for a person, and keeps a verifiable ledger."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Wilson", email = "198815669+mpwilso@users.noreply.github.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    # Exactly 2.2.0: every SDK behavior in docs/verified-facts.md (outcomes, progress,
    # cancellation, cache modes, capabilities) was checked against 2.2.0, and M1a's definition
    # hash depends on the SDK's served form (docs/PIN-SPEC.md, section 2). Change it only after
    # re-checking those facts on the newer release.
    "mcp==2.2.0",
    "mcp-types==2.2.0",
    # Imported directly (proxy.py catches its ValidationError); the version mcp 2.2.0 resolved.
    "pydantic==2.14.1",
    "rfc8785==0.1.4",
    # Imported directly (telemetry.py, for serve's spans); the version mcp 2.2.0 resolved.
    "opentelemetry-api==1.45.1",
]

[project.optional-dependencies]
# Exporting spans (docs/EXPORT-SPEC.md, section 2): the SDK and its OTLP over HTTP exporter, at
# the release that matches opentelemetry-api above. Without them serve's spans go nowhere.
otel = [
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.urls]
Homepage = "https://github.com/mpwilso/polarizer"
Source = "https://github.com/mpwilso/polarizer"
Issues = "https://github.com/mpwilso/polarizer/issues"
Changelog = "https://github.com/mpwilso/polarizer/blob/master/CHANGELOG.md"

[project.scripts]
polarizer = "polarizer.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    # The otel extra, so the tests can use the SDK's in-memory exporter and build the OTLP one.
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "reference: runs the pinned reference MCP servers with npx; skipped unless POLARIZER_REFERENCE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests keep each exact expected message on one line.
"tests/*" = ["E501"]
