[project]
name = "polarizer"
version = "0.1.0.dev0"
description = "A local proxy between an AI agent and its MCP servers, with a verifiable ledger."
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    # Exactly 2.2.0: every SDK behavior in docs/verified-facts.md (outcomes, progress,
    # cancellation, cache modes, capabilities) was checked against 2.2.0, and M1a's definition
    # hash depends on the SDK's served form (docs/PIN-SPEC.md, section 2). Change it only after
    # re-checking those facts on the newer release.
    "mcp==2.2.0",
    "mcp-types==2.2.0",
    # Imported directly (proxy.py catches its ValidationError); the version mcp 2.2.0 resolved.
    "pydantic==2.13.5",
    "rfc8785==0.1.4",
]

[project.scripts]
polarizer = "polarizer.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "reference: runs the pinned reference MCP servers with npx; skipped unless POLARIZER_REFERENCE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests keep each exact expected message on one line.
"tests/*" = ["E501"]
