[project]
name = "polarizer"
version = "0.1.0"
description = "A local MCP gateway that pins tool definitions, holds risky calls for a person, and keeps a verifiable ledger."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Wilson", email = "198815669+mpwilso@users.noreply.github.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    # Exactly 2.2.0: every SDK behavior in docs/verified-facts.md (outcomes, progress,
    # cancellation, cache modes, capabilities) was checked against 2.2.0, and M1a's definition
    # hash depends on the SDK's served form (docs/PIN-SPEC.md, section 2). Change it only after
    # re-checking those facts on the newer release.
    "mcp==2.2.0",
    "mcp-types==2.2.0",
    # Imported directly (proxy.py catches its ValidationError); the version mcp 2.2.0 resolved.
    "pydantic==2.13.5",
    "rfc8785==0.1.4",
]

[project.urls]
Homepage = "https://github.com/mpwilso/polarizer"
Source = "https://github.com/mpwilso/polarizer"
Issues = "https://github.com/mpwilso/polarizer/issues"
Changelog = "https://github.com/mpwilso/polarizer/blob/master/CHANGELOG.md"

[project.scripts]
polarizer = "polarizer.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "reference: runs the pinned reference MCP servers with npx; skipped unless POLARIZER_REFERENCE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests keep each exact expected message on one line.
"tests/*" = ["E501"]
