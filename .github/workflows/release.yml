name: release

# Builds the wheel and sdist for a published GitHub release, after checking that the release
# tag names the version in pyproject.toml, and keeps them as the run's artifact. The owner
# attaches them to the release (docs/dev/releasing.md). Publishing to PyPI was set up here on
# Oct 11, 2026, never used, and dropped on Oct 24, 2026.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Pinned by commit SHA, looked up on Oct 11, 2026 from each action's own repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.19"
      - name: The release tag names the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - name: Build
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

