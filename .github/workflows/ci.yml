name: ci

on:
  push:

permissions:
  contents: read

jobs:
  hang:
    name: macos hang hunt ${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      UV_PYTHON: "3.12"
      HANG_TIMEOUT: "120"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.19"
      - name: Install
        run: uv sync --locked
      - name: Where things are
        run: |
          command -v bash; bash --version | head -n 1; /bin/bash --version | head -n 1
          command -v tee; sw_vers; sysctl -n hw.ncpu
      - name: Loop the rugpull script tests for 40 minutes, with the rest of the suite looping beside them
        run: |
          export HANG_LOG="$RUNNER_TEMP/hang.log"
          : > "$HANG_LOG"
          end=$(( $(date +%s) + 2400 ))
          (
            n=0
            while [ "$(date +%s)" -lt "$end" ]; do
              n=$((n + 1))
              uv run --locked pytest -p no:cacheprovider --basetemp="$RUNNER_TEMP/bt-a" \
                --ignore=tests/test_rugpull_check.py > "$RUNNER_TEMP/load.txt" 2>&1 || true
              echo "load suite $n: $(tail -n 1 "$RUNNER_TEMP/load.txt")"
            done
          ) &
          load=$!
          i=0; ok=0; bad=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i + 1))
            start=$(date +%s)
            if uv run --locked pytest -p no:cacheprovider --basetemp="$RUNNER_TEMP/bt-b" --durations=3 \
                tests/test_rugpull_check.py > "$RUNNER_TEMP/out.txt" 2>&1; then
              ok=$((ok + 1)); echo "iteration $i passed in $(( $(date +%s) - start )) s"
            else
              bad=$((bad + 1)); echo "iteration $i FAILED in $(( $(date +%s) - start )) s"
              tail -n 80 "$RUNNER_TEMP/out.txt"
            fi
            grep -E '^[0-9.]+s call' "$RUNNER_TEMP/out.txt" | head -n 1
          done
          wait "$load"
          echo "iterations: $i passed: $ok failed: $bad"
          echo "=== hang log"
          cat "$HANG_LOG"
          [ "$bad" = 0 ]
