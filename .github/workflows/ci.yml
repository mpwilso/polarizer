name: ci

on:
  push:

permissions:
  contents: read

jobs:
  hang:
    name: macos hang hunt ${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    env:
      UV_PYTHON: "3.12"
      HANG_TIMEOUT: "120"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.19"
      - name: Install
        run: uv sync --locked
      - name: Where things are
        run: |
          command -v bash; bash --version | head -n 1; /bin/bash --version | head -n 1
          command -v tee; sw_vers; sysctl -n hw.ncpu
      - name: Leave a stuck rug-pull check behind
        run: uv run --locked python calib.py
