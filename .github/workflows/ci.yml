name: ci

on:
  push:

permissions:
  contents: read

jobs:
  hang:
    name: fifo synth ${{ matrix.shard }} ${{ matrix.variant }}
    runs-on: macos-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, variant: fix }
          - { shard: 2, variant: fix }
          - { shard: 3, variant: fix }
          - { shard: 4, variant: orig }
    env:
      UV_PYTHON: "3.12"
      HANG_TIMEOUT: "120"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.19"
      - name: Three drivers for 40 minutes
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          for n in 1 2 3; do python3 ci-synth/drive.py 2400 > "$RUNNER_TEMP/drive-$n.txt" 2>&1 & done
          wait
          cat "$RUNNER_TEMP"/drive-*.txt
          ! grep -q '=== HANG' "$RUNNER_TEMP"/drive-*.txt
