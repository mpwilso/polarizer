name: ci

on:
  push:

permissions:
  contents: read

jobs:
  hang:
    name: macos suite then rugpull x20, with the fix
    runs-on: macos-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    env:
      UV_PYTHON: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.19"
      - name: Install
        run: uv sync --locked
      - name: Where things are
        run: |
          command -v bash; bash --version | head -n 1; /bin/bash --version | head -n 1
          command -v tee; sw_vers; sysctl -n hw.ncpu
      - name: The whole suite, then the rugpull file 20 more times in the same pytest process
        run: |
          files=(tests)
          for n in $(seq 1 20); do files+=(tests/test_rugpull_check.py); done
          end=$(( $(date +%s) + 2700 ))
          i=0; ok=0; bad=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i + 1))
            start=$(date +%s)
            if uv run --locked pytest -p no:cacheprovider --keep-duplicates --durations=0 --durations-min=12 "${files[@]}" > "$RUNNER_TEMP/out.txt" 2>&1; then
              ok=$((ok + 1)); echo "round $i passed in $(( $(date +%s) - start )) s: $(tail -n 1 "$RUNNER_TEMP/out.txt")"
            else
              bad=$((bad + 1)); echo "round $i FAILED in $(( $(date +%s) - start )) s"
              grep -E '^(FAILED|ERROR)' "$RUNNER_TEMP/out.txt"; tail -n 1 "$RUNNER_TEMP/out.txt"
              sed -n '/= FAILURES =/,/short test summary/p' "$RUNNER_TEMP/out.txt" | head -n 400
            fi
            grep -E '^[0-9.]+s (call|setup|teardown)' "$RUNNER_TEMP/out.txt" | grep -v -e test_a_tee_that_never_exits -e test_hold_check -e test_m1a_check || true
          done
          echo "rounds: $i passed: $ok failed: $bad"
          [ "$bad" = 0 ]
