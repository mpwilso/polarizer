# An example polarizer.toml: the reference Filesystem MCP server, pinned to an exact version,
# behind Polarizer. Copy it with /home/you replaced by your home directory:
#   mkdir -p ~/.config/polarizer ~/projects/demo
#   sed "s|/home/you|$HOME|g" polarizer.example.toml > ~/.config/polarizer/polarizer.toml
# README.md walks through it. docs/PROXY-SPEC.md describes every key, and docs/HOLD-SPEC.md the
# [policy] table and the classes.

# Where the ledger goes. This is the default; set it to keep a ledger elsewhere.
# ledger_dir = "~/.local/share/polarizer"

# Directories the ledger must never be written to, such as your other repositories. Optional.
# ledger_forbidden_paths = ["~/code/some-project"]

# Which calls are held for you. A local-write call runs without a hold only when every path it
# names resolves inside a workspace root and matches no hold pattern; destructive and egress
# calls, and calls to tools with no class, are always held. Each root must exist when serve
# starts.
[policy]
workspace_roots = ["/home/you/projects/demo"]
# A held call is refused if nobody decides within this many seconds (1 to 1200).
hold_timeout_seconds = 300
# Added to the built-in hold patterns, which can't be removed. Optional.
# write_hold_patterns = ["deploy/**"]
# read_hold_patterns = ["~/.kube/**"]

# One MCP server; its tools are exposed as fs__<tool>. Run its command once by hand before the
# first start, so the npx fetch doesn't miss Polarizer's connect timeout:
#   npx -y @modelcontextprotocol/server-filesystem@2026.8.31 "$HOME/projects/demo" < /dev/null
[upstream.fs]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem@2026.8.31", "/home/you/projects/demo"]
connect_timeout_seconds = 20

# A class for each of the 14 tools this version of the server lists. Reads run; writes outside
# the workspace root, or into .git/hooks and the other built-in patterns, are held; move_file is
# held on every call. read_file is the server's deprecated name for read_text_file.
[upstream.fs.tools]
read_file = { class = "local-read", path_args = ["path"] }
read_text_file = { class = "local-read", path_args = ["path"] }
read_media_file = { class = "local-read", path_args = ["path"] }
read_multiple_files = { class = "local-read", path_args = ["paths"] }
list_directory = { class = "local-read", path_args = ["path"] }
list_directory_with_sizes = { class = "local-read", path_args = ["path"] }
directory_tree = { class = "local-read", path_args = ["path"] }
search_files = { class = "local-read", path_args = ["path"] }
get_file_info = { class = "local-read", path_args = ["path"] }
list_allowed_directories = { class = "local-read" }
write_file = { class = "local-write", path_args = ["path"] }
edit_file = { class = "local-write", path_args = ["path"] }
create_directory = { class = "local-write", path_args = ["path"] }
move_file = { class = "destructive", path_args = ["source", "destination"] }

# Another kind of server, sketched: an issue tracker. Reading tickets runs; filing or closing one
# is held on every call, so the agent can draft a ticket and wait while `polarizer holds` shows
# you its exact arguments. `polarizer allow <hold id>` forwards exactly those, and `deny` drops
# them. A tool the tracker adds later, such as update_issue, is new, not a changed definition:
# it stays hidden and is refused until `polarizer pending` and `approve` let it in. Give it a
# class here too, or every call to it is held.
# [upstream.tracker]
# command = "your-tracker-server"
#
# [upstream.tracker.tools]
# get_issue = { class = "open-world" }
# create_issue = { class = "egress" }
# close_issue = { class = "destructive" }
