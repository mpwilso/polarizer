<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" width="680" height="356" role="img" aria-label="How Polarizer works: the agent, Claude Code, sends every tool call to polarizer serve. There, pins list only the tool definitions you approved, a rule function looks at the tool's class and the call's resolved paths, and a risky call is held until you allow or deny it or it times out. Allowed calls go on to the MCP servers. Every call, hold and decision goes into a hash-chained ledger. You run pending, approve, holds, allow, deny and verify in a terminal; they read the ledger and write your decisions to it. The agent's own shell and file tools are not routed through Polarizer."><title>How Polarizer works: the agent, Claude Code, sends every tool call to polarizer serve. There, pins list only the tool definitions you approved, a rule function looks at the tool's class and the call's resolved paths, and a risky call is held until you allow or deny it or it times out. Allowed calls go on to the MCP servers. Every call, hold and decision goes into a hash-chained ledger. You run pending, approve, holds, allow, deny and verify in a terminal; they read the ledger and write your decisions to it. The agent's own shell and file tools are not routed through Polarizer.</title><rect x="16" y="70" width="164" height="56" rx="4" fill="none" stroke="#1D4ED8" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1c1c1a"><tspan x="28" y="93.0" font-weight="700">Agent</tspan><tspan x="28" y="111.0">Claude Code</tspan></text><rect x="212" y="20" width="256" height="204" rx="6" fill="#F5F8FE" stroke="#1D4ED8" stroke-width="1.5"/><text x="226" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1c1c1a">polarizer serve</text><rect x="226" y="54" width="228" height="48" rx="4" fill="#1E3A8A" stroke="#1D4ED8" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#F1F5FF"><tspan x="238" y="73.0" font-weight="700">Pins: only approved</tspan><tspan x="238" y="91.0">definitions are listed</tspan></text><rect x="226" y="110" width="228" height="48" rx="4" fill="#1E3A8A" stroke="#1D4ED8" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#F1F5FF"><tspan x="238" y="129.0" font-weight="700">Rule: the tool's class</tspan><tspan x="238" y="147.0">and the resolved paths</tspan></text><rect x="226" y="166" width="228" height="48" rx="4" fill="#1E3A8A" stroke="#1D4ED8" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#F1F5FF"><tspan x="238" y="185.0" font-weight="700">Holds: wait for allow</tspan><tspan x="238" y="203.0">or deny, or time out</tspan></text><rect x="500" y="70" width="164" height="56" rx="4" fill="none" stroke="#1D4ED8" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1c1c1a"><tspan x="512" y="93.0" font-weight="700">MCP servers</tspan><tspan x="512" y="111.0">upstream tools</tspan></text><line x1="186" y1="98" x2="206" y2="98" stroke="#1c1c1a" stroke-width="1.5"/><polygon points="180,98 186,94 186,102" fill="#1c1c1a"/><polygon points="212,98 206,94 206,102" fill="#1c1c1a"/><line x1="474" y1="98" x2="494" y2="98" stroke="#1c1c1a" stroke-width="1.5"/><polygon points="468,98 474,94 474,102" fill="#1c1c1a"/><polygon points="500,98 494,94 494,102" fill="#1c1c1a"/><rect x="212" y="268" width="256" height="56" rx="4" fill="#F5F8FE" stroke="#1D4ED8" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1c1c1a"><tspan x="224" y="291.0" font-weight="700">Ledger: every call, hold</tspan><tspan x="224" y="309.0">and decision, chained</tspan></text><line x1="340" y1="230" x2="340" y2="262" stroke="#1c1c1a" stroke-width="1.5"/><polygon points="340,224 336,230 344,230" fill="#1c1c1a"/><polygon points="340,268 336,262 344,262" fill="#1c1c1a"/><rect x="16" y="252" width="164" height="88" rx="4" fill="#1c1c1a" stroke="#1D4ED8" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#F1F5FF"><tspan x="28" y="273.0" font-weight="700">You, in a terminal:</tspan><tspan x="28" y="291.0">pending, approve</tspan><tspan x="28" y="309.0">holds, allow, deny</tspan><tspan x="28" y="327.0">verify</tspan></text><line x1="186" y1="296" x2="206" y2="296" stroke="#1c1c1a" stroke-width="1.5"/><polygon points="180,296 186,292 186,300" fill="#1c1c1a"/><polygon points="212,296 206,292 206,300" fill="#1c1c1a"/><rect x="500" y="252" width="164" height="88" rx="4" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="4 3"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1c1c1a"><tspan x="512" y="273.0" font-weight="700">Not routed through</tspan><tspan x="512" y="291.0">Polarizer: the</tspan><tspan x="512" y="309.0">agent's shell and</tspan><tspan x="512" y="327.0">its own file tools</tspan></text></svg>
