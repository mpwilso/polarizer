<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 100" width="430" height="100" role="img" aria-label="Polarizer: a round filter of parallel lines, with one line turned out of line"><title>Polarizer: a round filter of parallel lines, with one line turned out of line</title><style>.draw{transform-box:fill-box;transform-origin:50% 0;animation:draw 0.4s ease-out backwards}@keyframes draw{from{transform:scaleY(0)}}.d0{animation-delay:0.00s}.d1{animation-delay:0.07s}.d2{animation-delay:0.14s}.d3{animation-delay:0.21s}.d4{animation-delay:0.28s}.d5{animation-delay:0.35s}.d6{animation-delay:0.42s}.d7{animation-delay:0.49s}.d8{animation-delay:0.56s}.turn{transform-box:view-box;transform-origin:58px 50px;animation:turn 0.64s ease-in-out 0.96s backwards}@keyframes turn{from{transform:rotate(-28deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.word{font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:3px}</style><defs><clipPath id="face"><circle cx="50" cy="50" r="42"/></clipPath></defs><circle cx="50" cy="50" r="44" fill="#EAF1FD"/><g clip-path="url(#face)" fill="none" stroke="#A9C4F5" stroke-width="3"><path class="draw d0" d="M18 6 V94"/><path class="draw d1" d="M26 6 V94"/><path class="draw d2" d="M34 6 V94"/><path class="draw d3" d="M42 6 V94"/><path class="draw d4" d="M50 6 V94"/><path class="draw d6" d="M66 6 V94"/><path class="draw d7" d="M74 6 V94"/><path class="draw d8" d="M82 6 V94"/></g><g class="turn"><g transform="rotate(28 58 50)" fill="none" stroke-linecap="round"><path class="draw d5" d="M58 30 V70" stroke="#EAF1FD" stroke-width="13"/><path class="draw d5" d="M58 30 V70" stroke="#1D4ED8" stroke-width="7"/></g></g><circle cx="50" cy="50" r="44" fill="none" stroke="#1E3A8A" stroke-width="5"/><text class="word" x="112" y="67" font-size="46" textLength="300" lengthAdjust="spacing" fill="#1c1c1a">POLARIZER</text></svg>
