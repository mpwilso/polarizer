<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 100" width="430" height="100" role="img" aria-label="Polarizer: a round filter of parallel lines, with one line turned out of line"><title>Polarizer: a round filter of parallel lines, with one line turned out of line</title><style>.turn{transform-box:view-box;transform-origin:58px 50px;animation:turn 1.6s ease-out}@keyframes turn{from{transform:rotate(-28deg)}to{transform:rotate(0deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.word{font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:3px}</style><defs><clipPath id="face"><circle cx="50" cy="50" r="42"/></clipPath></defs><circle cx="50" cy="50" r="44" fill="#0E1A33"/><g clip-path="url(#face)" fill="none" stroke="#34548C" stroke-width="3"><path d="M18 6 V94"/><path d="M26 6 V94"/><path d="M34 6 V94"/><path d="M42 6 V94"/><path d="M50 6 V94"/><path d="M66 6 V94"/><path d="M74 6 V94"/><path d="M82 6 V94"/></g><g class="turn"><g transform="rotate(28 58 50)" fill="none" stroke-linecap="round"><path d="M58 30 V70" stroke="#0E1A33" stroke-width="13"/><path d="M58 30 V70" stroke="#7FB0FF" stroke-width="7"/></g></g><circle cx="50" cy="50" r="44" fill="none" stroke="#6EA0F5" stroke-width="5"/><text class="word" x="112" y="67" font-size="46" textLength="300" lengthAdjust="spacing" fill="#EDEDEA">POLARIZER</text></svg>
